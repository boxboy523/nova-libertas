name: Windows CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Rust stable
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default stable

      - name: Build release
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Package executable and assets
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path dist/nova-libertas-windows-x64 | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/nova_libertas.exe dist/nova-libertas-windows-x64/
          Copy-Item assets dist/nova-libertas-windows-x64/assets -Recurse
          Compress-Archive -Path dist/nova-libertas-windows-x64 -DestinationPath dist/nova-libertas-windows-x64.zip

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: nova-libertas-windows-x64
          path: dist/nova-libertas-windows-x64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
